# Render blueprint: https://render.com/docs/blueprint-spec
# Free tier: one web service (API + UI on one origin, worker loop embedded) + Postgres.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
# To scale out, add a `type: worker` service with dockerCommand
# `python -m rampscout.worker.main` (paid plan). Claims are row-locked, so both can run.
databases:
  - name: rampscout-db
    plan: free
    databaseName: rampscout
    user: rampscout

services:
  - type: web
    name: rampscout
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rampscout-db
          property: connectionString
      - key: EMBEDDED_WORKER
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: CLOCK_MODE
        value: fixture
      - key: DEMO_TRANSFER_SCALE
        value: "0.01"
      - key: MIN_SIGNER_USDC
        value: "6"
      - key: MAX_ONCHAIN_TRANSFER_USDC
        value: "10"
      - key: DAILY_ONCHAIN_RUNS
        value: "20"
      - key: EXPECTED_CHAIN_ID
        value: "84532"
      - key: USDC_CONTRACT
        value: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      - key: EXPLORER_TX_URL
        value: https://sepolia.basescan.org/tx/
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: RPC_SEND_URL
        value: https://sepolia-sequencer.base.org
      - key: SIGNER_PRIVATE_KEY
        sync: false
      - key: SIGNER_ADDRESS
        sync: false
      - key: ROUTE_A_SETTLEMENT_ADDRESS
        sync: false
      - key: ROUTE_B_SETTLEMENT_ADDRESS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
