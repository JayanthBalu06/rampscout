# Render blueprint: https://render.com/docs/blueprint-spec
# Web (API + UI on one origin), background worker, and Postgres.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
databases:
  - name: rampscout-db
    plan: free
    databaseName: rampscout
    user: rampscout

services:
  - type: web
    name: rampscout-web
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars: &env
      - key: DATABASE_URL
        fromDatabase:
          name: rampscout-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: CLOCK_MODE
        value: fixture
      - key: DEMO_TRANSFER_SCALE
        value: "0.01"
      - key: MAX_ONCHAIN_TRANSFER_USDC
        value: "10"
      - key: DAILY_ONCHAIN_RUNS
        value: "20"
      - key: EXPECTED_CHAIN_ID
        value: "84532"
      - key: USDC_CONTRACT
        value: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      - key: EXPLORER_TX_URL
        value: https://sepolia.basescan.org/tx/
      - key: RPC_URL
        sync: false
      - key: RPC_SEND_URL
        sync: false
      - key: SIGNER_PRIVATE_KEY
        sync: false
      - key: SIGNER_ADDRESS
        sync: false
      - key: ROUTE_A_SETTLEMENT_ADDRESS
        sync: false
      - key: ROUTE_B_SETTLEMENT_ADDRESS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: worker
    name: rampscout-worker
    runtime: docker
    plan: starter  # Render background workers are not on the free plan
    dockerCommand: python -m rampscout.worker.main
    envVars: *env
