name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rampscout
          POSTGRES_PASSWORD: rampscout
          POSTGRES_DB: rampscout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rampscout"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rampscout:rampscout@localhost:5432/rampscout_test
      TEST_DATABASE_URL: postgresql+psycopg://rampscout:rampscout@localhost:5432/rampscout_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://rampscout:rampscout@localhost:5432/rampscout_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: mypy rampscout
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rampscout
          POSTGRES_PASSWORD: rampscout
          POSTGRES_DB: rampscout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rampscout"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rampscout:rampscout@localhost:5432/rampscout
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e './backend'
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API + UI on one origin
        working-directory: backend
        run: |
          alembic upgrade head
          nohup uvicorn rampscout.api.server:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-artifacts
          path: |
            api.log
            frontend/test-results
