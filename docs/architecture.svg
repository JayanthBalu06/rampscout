<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>RampScout architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.5}
      .real{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
      .sim{fill:#fffbeb;stroke:#d97706;stroke-width:1.5;stroke-dasharray:6 4}
      .db{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
      .t{fill:#0f172a;font-weight:600;font-size:14px}
      .s{fill:#475569;font-size:12px}
      .l{fill:#334155;font-size:11.5px}
      .line{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .both{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#a);marker-start:url(#a)}
    </style>
  </defs>
  <rect width="980" height="560" fill="#f8fafc"/>

  <!-- Client -->
  <rect class="box" x="24" y="60" width="190" height="120" rx="12"/>
  <text class="t" x="40" y="88">React client</text>
  <text class="s" x="40" y="110">Compare · watch builder</text>
  <text class="s" x="40" y="128">review · timeline · receipt</text>
  <text class="s" x="40" y="146">polls status every 2 s</text>
  <text class="s" x="40" y="164">session cookie, no keys</text>

  <!-- API -->
  <rect class="box" x="300" y="40" width="250" height="160" rx="12"/>
  <text class="t" x="316" y="68">FastAPI</text>
  <text class="s" x="316" y="90">POST /quotes · /intents/parse</text>
  <text class="s" x="316" y="108">POST /authorizations (+preview)</text>
  <text class="s" x="316" y="126">   Idempotency-Key → terms hash</text>
  <text class="s" x="316" y="144">GET /authorizations/{id} · cancel</text>
  <text class="s" x="316" y="162">POST /demo/advance · /reconcile</text>
  <text class="s" x="316" y="184">decimal strings in, decimal strings out</text>

  <!-- Worker -->
  <rect class="box" x="300" y="250" width="250" height="132" rx="12"/>
  <text class="t" x="316" y="278">Worker (any number of copies)</text>
  <text class="s" x="316" y="300">1. reconcile anything mid-flight</text>
  <text class="s" x="316" y="318">2. claim due watches</text>
  <text class="s" x="316" y="336">   FOR UPDATE SKIP LOCKED</text>
  <text class="s" x="316" y="354">3. evaluate_watch() (same code as</text>
  <text class="s" x="316" y="372">   /demo/advance) → wait / notify / execute</text>

  <!-- Postgres -->
  <rect class="db" x="300" y="420" width="250" height="118" rx="12"/>
  <text class="t" x="316" y="448">PostgreSQL</text>
  <text class="s" x="316" y="470">authorizations (terms, version, status)</text>
  <text class="s" x="316" y="488">decision_events (ordered, append-only)</text>
  <text class="s" x="316" y="506">quote_snapshots · notifications</text>
  <text class="s" x="316" y="524">executions UNIQUE(authorization_id)</text>

  <!-- Claude -->
  <rect class="real" x="640" y="24" width="316" height="78" rx="12"/>
  <text class="t" x="656" y="50">Claude API (optional)</text>
  <text class="s" x="656" y="70">text → editable IntentDraft (JSON schema)</text>
  <text class="s" x="656" y="88">drafts only: never authorizes or picks addresses</text>

  <!-- Providers -->
  <rect class="sim" x="640" y="122" width="316" height="96" rx="12"/>
  <text class="t" x="656" y="148">Provider adapters A · B</text>
  <text class="s" x="656" y="168">synthetic quotes, tick script, fresh id + expiry</text>
  <text class="s" x="656" y="186">fetched concurrently, bounded timeouts</text>
  <text class="s" x="656" y="204">errors kept apart from "below target"</text>

  <!-- Settlement -->
  <rect class="box" x="640" y="240" width="316" height="150" rx="12"/>
  <text class="t" x="656" y="266">Settlement adapter</text>
  <text class="s" x="656" y="288">preflight: chain id, USDC, recipient from server</text>
  <text class="s" x="656" y="306">config, spending limit, balance</text>
  <text class="s" x="656" y="324">sign → persist bytes + hash → commit → send</text>
  <text class="s" x="656" y="342">unknown outcome → query hash / resend same bytes</text>
  <text class="s" x="656" y="360">confirm only on status 1 + exact Transfer log</text>
  <text class="s" x="656" y="378">advisory lock per wallet (nonces)</text>

  <!-- Chain -->
  <rect class="real" x="640" y="410" width="150" height="92" rx="12"/>
  <text class="t" x="654" y="436">Base Sepolia</text>
  <text class="s" x="654" y="456">real test USDC</text>
  <text class="s" x="654" y="474">transfer (×0.01)</text>
  <text class="s" x="654" y="492">chain 84532</text>

  <rect class="sim" x="806" y="410" width="150" height="92" rx="12"/>
  <text class="t" x="820" y="436">Simulated</text>
  <text class="s" x="820" y="456">MXN conversion +</text>
  <text class="s" x="820" y="474">SPEI deposit (retry</text>
  <text class="s" x="820" y="492">payout only)</text>

  <!-- Arrows -->
  <path class="both" d="M214,120 L298,120"/>
  <text class="l" x="222" y="112">HTTPS</text>
  <path class="line" d="M550,70 L638,62"/>
  <path class="line" d="M550,150 L638,166"/>
  <path class="line" d="M550,300 Q600,250 638,200"/>
  <path class="line" d="M550,330 L638,320"/>
  <path d="M425,202 L425,248" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text class="l" x="434" y="230">shared agent code</text>
  <path class="both" d="M425,382 L425,418"/>
  <path class="line" d="M300,180 Q250,320 300,470"/>
  <text class="l" x="196" y="404">reads/writes</text>
  <path class="line" d="M715,390 L715,408"/>
  <path class="line" d="M880,390 L880,408"/>

  <!-- Legend -->
  <rect class="real" x="24" y="230" width="18" height="14" rx="3"/>
  <text class="l" x="50" y="242">real integration</text>
  <rect class="sim" x="24" y="256" width="18" height="14" rx="3"/>
  <text class="l" x="50" y="268">fixture / simulated</text>
  <rect class="db" x="24" y="282" width="18" height="14" rx="3"/>
  <text class="l" x="50" y="294">durable state</text>
  <text class="l" x="24" y="330" style="font-weight:600">Only confirmed,</text>
  <text class="l" x="24" y="346" style="font-weight:600">structured terms</text>
  <text class="l" x="24" y="362" style="font-weight:600">authorize execution.</text>
</svg>
